[tools]
"core:deno" = "2.9.8"

[tasks.test]
depends = ["test:unit", "test:integration"]

[tasks."test:unit"]
run = "deno test --allow-all cli/ lib/ web/"

[tasks."test:integration"]
run = "deno test --allow-all tests/"

[tasks.fmt]
run = "deno fmt"

[tasks.icons]
run = "deno run --allow-read --allow-write=web/public --allow-env scripts/icons.ts"

[tasks.dev]
# Published on the tailnet while it runs, so the phone can open it too.
run = """
tailscale serve --bg --https="$DIFIT_HUB_WEB_PORT" "http://127.0.0.1:$DIFIT_HUB_WEB_PORT" >/dev/null
trap 'tailscale serve --https="$DIFIT_HUB_WEB_PORT" off >/dev/null' EXIT
trap 'exit 130' INT TERM
echo "dev: https://$(tailscale status --self --json | jq -r '.Self.DNSName | rtrimstr(".")'):$DIFIT_HUB_WEB_PORT/"
deno run --watch --allow-all web/server.ts
"""
env = { DIFIT_HUB_WEB_PORT = "4985" }

[tasks.setup]
depends = ["icons"]
run = "apm install"
