name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
      - run: mise run icons
      - run: mise run test
      - name: Package
        run: |
          name="difit-hub-${GITHUB_REF_NAME}"
          mkdir "${name}"
          cp -r bin cli lib web systemd deno.json deno.lock LICENSE THIRD_PARTY_NOTICES.md README.md "${name}/"
          rm "${name}"/*/*_test.ts
          tar czf "${name}.tar.gz" "${name}"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" "difit-hub-${GITHUB_REF_NAME}.tar.gz" --generate-notes
